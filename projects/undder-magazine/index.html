<script>(function(){
  var slug="undder-magazine";
  function fallback(){
    var params=new URLSearchParams(location.search);
    params.set('project',slug);
    location.replace('/?'+params.toString()+location.hash);
  }
  fetch('/index.html',{credentials:'same-origin'})
    .then(function(r){if(!r.ok)throw new Error('Site unavailable');return r.text();})
    .then(function(html){
      if(!/<head(?:\s[^>]*)?>/i.test(html))throw new Error('Invalid site document');
      html=html.replace(/<head(?:\s[^>]*)?>/i,function(tag){return tag+'<base href="/">';});
      document.open();
      document.write(html);
      document.close();
    })
    .catch(fallback);
})();</script>
